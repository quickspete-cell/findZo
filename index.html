<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f9ff;--sf:#ffffff;--tx:#10213d;--mu:#5c6b83;--ln:#dbe5f3;--ac:#0b3d91;--act:#ffffff;--rd:#c0392b;--ok:#00a878;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--sf:#0b0e12;--tx:#f2f6fa;--mu:#9aa6b2;--ln:#1e252d;--ac:#3ddc5a;--act:#031a08;--rd:#ff7b6b;--ok:#3ddc5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--sf:#0b0e12;--tx:#f2f6fa;--mu:#9aa6b2;--ln:#1e252d;--ac:#3ddc5a;--act:#031a08;--rd:#ff7b6b;--ok:#3ddc5a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:560px;margin:0 auto;padding:0 16px 130px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}
.logo{display:block;border-radius:22%}
.hl{display:flex;align-items:center;gap:10px}
.auth .logo{width:112px;height:112px;margin:0 auto 14px}
.auth{text-align:center}.auth .card,.auth label{text-align:left}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:17px;margin:22px 0 10px}
h3{font-size:16px;margin:0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.tap{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mu{color:var(--mu);font-size:13px}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;background:var(--ac);color:var(--act);cursor:pointer}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--ln)}
.btn.d{background:transparent;color:var(--rd);border:1px solid var(--ln)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.w{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-size:13px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,currentColor 16%,transparent);white-space:nowrap}
.Pending{color:#b07d00}.Accepted{color:#1a73c8}.Ready{color:#7b4fc9}.Delivering{color:#0f8f9a}.Completed{color:var(--ok)}.Cancelled{color:var(--rd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.bar{height:8px;border-radius:99px;background:var(--ln);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-size:18px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;max-width:112px;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cartbar{position:fixed;left:16px;right:16px;max-width:528px;margin:0 auto;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--act);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9;font-weight:600}
.cartbar button{background:var(--act);color:var(--ac);border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sh{background:var(--sf);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;display:none}
.empty{text-align:center;color:var(--mu);padding:28px 12px}
.auth{max-width:420px;margin:0 auto;padding:60px 20px}
@media(prefers-reduced-motion:no-preference){.card,.stat{transition:border-color .15s}.card.tap:hover{border-color:var(--ac)}}
.hb{display:flex;gap:8px;align-items:center}
.ib{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib span{position:absolute;top:-5px;right:-5px;background:var(--rd);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-weight:700}
.sb{display:flex;align-items:center;gap:8px;background:var(--ln);border-radius:14px;padding:0 14px;margin:6px 0 4px;color:var(--mu)}
.sb input{border:0;background:transparent;margin:0;padding:13px 0}
.sb svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.sb.tap{padding:13px 14px;cursor:pointer}
.cats{display:flex;gap:14px;overflow-x:auto;padding:4px 0 8px}
.cat{flex:none;width:66px;background:none;border:0;color:var(--tx);font:inherit;font-size:12px;cursor:pointer;padding:0}
.cat i{display:flex;width:58px;height:58px;border-radius:50%;align-items:center;justify-content:center;font-size:25px;font-style:normal;margin:0 auto 5px;border:2px solid transparent}
.cat.on i{border-color:var(--ac)}
.cat.on{font-weight:700}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.pc{cursor:pointer}
.im{aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--ln)}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;color:#3a3a35}
.pc b{display:block;margin-top:7px;font-size:14px;line-height:1.25}
.pc .pr{font-weight:700;color:var(--ac)}
.pv{max-width:170px;margin-bottom:8px}
.im{position:relative}
.tag{position:absolute;top:8px;left:8px;background:var(--rd);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.sold img,.sold .ph{opacity:.45}
.sold b,.sold .pr{color:var(--mu)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;border:0;border-radius:99px;background:var(--ac);color:var(--act);font:inherit;font-weight:700;padding:12px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab{display:flex;align-items:center;gap:8px}
.fab.up{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
.log{max-height:42vh;overflow:auto;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.bub{padding:10px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.u{align-self:flex-end;background:var(--ac);color:var(--act)}
.bub.a{align-self:flex-start;background:var(--bg);border:1px solid var(--ln)}
.sug{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.air{display:flex;gap:8px}
a.btn{display:inline-block;text-decoration:none;text-align:center}
a.btn.w{display:block}
.air input{margin:0}
.big{aspect-ratio:auto;height:300px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

async function hashPin(ph,pin){
 const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ph+":"+pin));
 return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")
}
async function doLogin(){
 const n=$("#an").value.trim(),p=$("#ap").value.replace(/\s/g,""),pin=$("#aq").value;
 if(p.length<9||!/^[0-9+]+$/.test(p)){toast("Enter a valid phone number");return}
 if(!/^\d{4,6}$/.test(pin)){toast("PIN must be 4 to 6 digits");return}
 let h;try{h=await hashPin(p,pin)}catch(e){toast("This browser cannot secure your PIN");return}
 let u=db.users.find(x=>x.phone===p);
 if(!u){if(!n){toast("Enter your name to create an account");return}u={id:uid(),name:n,phone:p,ph:h};db.users.push(u);save()}
 else if(!u.ph){u.ph=h;save()}
 else if(u.ph!==h){toast("Wrong PIN for this number");return}
 ls.set("findzo_me",u.id);S=newS();render();
}

const lbl=s=>({Delivering:"Out for delivery"}[s]||s);
const feeOf=b=>Math.max(0,Number(b&&b.fee)||0);
const orderTotal=()=>cartTotal()+feeOf(bz(S.cartBiz));
const code=o=>o.id.slice(0,6).toUpperCase();
const FEE_RATE=0.07;
const subOf=o=>o.items.reduce((a,i)=>a+i.price*i.qty,0);
const pfOf=o=>o.pf!=null?o.pf:Math.round(subOf(o)*FEE_RATE);
const owedOf=id=>db.orders.filter(o=>o.bizId===id&&o.status==="Completed"&&!o.pfPaid).reduce((a,o)=>a+pfOf(o),0);
const waNum=p=>{p=String(p||"").replace(/\D/g,"");return p.startsWith("0")?"265"+p.slice(1):p};
const wa=(p,t)=>"https://wa.me/"+waNum(p)+"?text="+encodeURIComponent(t);
const sms=(p,t)=>"sms:"+(p?"+"+waNum(p):"")+"?&body="+encodeURIComponent(t);
const starTxt=n=>"★".repeat(n)+"☆".repeat(5-n);
function badge(b){
 const r=db.reviews.filter(x=>x.bizId===b.id),avg=r.length?r.reduce((a,x)=>a+x.stars,0)/r.length:0;
 return (b.verified?'<span class="pill" style="color:var(--ok)">Verified</span> ':'')+(r.length?'<span class="mu">★ '+avg.toFixed(1)+' ('+r.length+')</span>':'<span class="mu">No reviews yet</span>')
}
function bizCard(b){
 const m=minP(b.id),f=(db.favs[me().id]||[]).includes(b.id);
 return '<div class="card tap" data-a="biz" data-id="'+b.id+'"><div class="row"><h3>'+esc(b.name)+'</h3>'+(f?'<span class="pill" style="color:var(--ac)">Saved</span>':'')+'</div><div class="mu">'+esc(b.cat)+' · '+esc(b.loc)+(m!=null?' · from '+money(m):'')+'</div><div style="margin:4px 0">'+badge(b)+'</div><div>'+esc(b.desc)+'</div></div>'
}
function pimg(p,b){
 if(p.img)return '<img src="'+p.img+'" alt="'+esc(p.name)+'">';
 return '<div class="ph" style="background:'+CT[b?b.cat:"Other"]+'">'+esc(p.name.trim().charAt(0).toUpperCase())+'</div>'
}
function pcard(p,hideShop){
 const b=bz(p.bizId);
 return '<div class="pc'+(p.avail?'':' sold')+'" data-a="prod" data-id="'+p.id+'"><div class="im">'+pimg(p,b)+(p.avail?'':'<span class="tag">Sold</span>')+'</div><b>'+esc(p.name)+'</b><span class="pr">'+money(p.price)+'</span>'+(hideShop?'':'<div class="mu">'+esc(b.name)+'</div>')+'</div>'
}
function homeV(){
 const ok=b=>S.cat==="All"||b.cat===S.cat;
 const ps=db.products.filter(p=>bz(p.bizId)&&!bz(p.bizId).suspended&&ok(bz(p.bizId))).sort((x,y)=>Number(!!y.avail)-Number(!!x.avail));
 const bs=db.businesses.filter(b=>ok(b)&&!b.suspended);
 return '<div class="sb tap" data-a="nav" data-t="search"><svg viewBox="0 0 24 24">'+IC.search+'</svg><span>Search products or shops</span></div><h2>Categories</h2><div class="cats">'+["All",...CATS].map(c=>'<button class="cat '+(S.cat===c?"on":"")+'" data-a="chip" data-c="'+c+'"><i style="background:'+CT[c]+'">'+CE[c]+'</i>'+c+'</button>').join("")+'</div><h2>Featured</h2>'+(ps.length?'<div class="pg">'+ps.map(p=>pcard(p)).join("")+'</div>':'<div class="empty">No products in this category yet.</div>')+'<h2>Shops</h2>'+(bs.length?bs.map(bizCard).join(""):'<div class="empty">No shops in this category yet.</div>')+'<div class="card" style="text-align:center"><b>Testing this prototype?</b><p class="mu" style="margin:6px 0 10px">Tell us what to change, add, or remove.</p><button class="btn" data-a="fb">Share your idea</button></div>'
}

function bizV(b){
 const own=b.ownerId===me().id,f=(db.favs[me().id]||[]).includes(b.id),ps=prods(b.id);

 return '<button class="btn s sm" data-a="back">Back</button><div class="row" style="margin:14px 0 4px"><h2 style="margin:0">'+esc(b.name)+'</h2><button class="btn s sm" data-a="fav" data-id="'+b.id+'">'+(f?"Unsave":"Save")+'</button></div><div style="margin-bottom:4px">'+badge(b)+'</div><div class="mu">'+esc(b.cat)+' · '+esc(b.loc)+' · '+esc(b.hours)+' · '+esc(b.phone)+'</div><div class="mu">Delivery fee: '+(feeOf(b)?money(feeOf(b)):"Free")+'</div><p>'+esc(b.desc)+'</p>'+(b.suspended?'<div class="card mu">This shop is suspended by the admin.</div>':'')+(own?'<div class="card mu">This is your shop. Manage it from Profile.</div>':'')+'<h2>Products</h2>'+(ps.length?'<div class="pg">'+ps.map(p=>pcard(p,1)).join("")+'</div>':'<div class="empty">No products listed yet.</div>')+'<h2>Reviews</h2>'+(rv.length?rv.map(x=>{const u=db.users.find(y=>y.id===x.buyerId);return '<div class="card"><div class="row"><b>'+esc(u?u.name.split(" ")[0]:"Buyer")+'</b><span style="color:#d99a00">'+starTxt(x.stars)+'</span></div>'+(x.text?'<div>'+esc(x.text)+'</div>':'')+'</div>'}).join(""):'<div class="empty">No reviews yet.</div>')+(own?'':'<button class="btn d w" data-a="report" data-id="'+b.id+'">Report this shop</button>')
}
function prodV(p){
 const b=bz(p.bizId),own=b.ownerId===me().id,q=S.cart[p.id]||0;
 let cta="";
 if(b.suspended&&!own)cta='<div class="card mu">This shop is suspended and cannot take orders.</div>';else if(own)cta='<div class="card mu">This is your product. Edit it from Profile.</div>';

function trStr(s,keepOnlyExact){
 if(LANG!=="ny"||!s)return s;
 const k=s.trim();
 if(!k)return s;
 if(Object.prototype.hasOwnProperty.call(NY,k))return s.replace(k,NY[k]);
 if(keepOnlyExact)return s;
 let r=s;for(const [re,to] of NYR)r=r.replace(re,to);
 return r;
}
function tr(root){
 if(LANG!=="ny"||!root||!document.createTreeWalker)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 let n;while((n=w.nextNode()))nodes.push(n);
 nodes.forEach(t=>{
  const p=t.parentElement;if(!p||p.tagName==="TEXTAREA"||p.tagName==="SCRIPT"||p.tagName==="STYLE")return;
  const v=trStr(t.nodeValue,!!p.closest(".bub"));if(v!==t.nodeValue)t.nodeValue=v;
 });
 root.querySelectorAll("[placeholder],[aria-label]").forEach(e=>{["placeholder","aria-label"].forEach(a=>{const v=e.getAttribute(a);if(v){const x=trStr(v);if(x!==v)e.setAttribute(a,x)}})});
}

let AI=null,AIH=[],aiBusy=false;
const AISUG=["Cheapest food right now","Where can I get printing done?","What is still available?","Help me write a product description"];
function aiData(){
 const o=db.businesses.filter(b=>!b.suspended).map(b=>({shop:b.name,type:b.cat,location:b.loc,hours:b.hours,products:prods(b.id).slice(0,12).map(p=>({name:p.name,price:p.price,status:p.avail?"available":"sold",details:(p.desc||"").slice(0,80)}))}));
 return JSON.stringify(o).slice(0,9000);
}
function aiLog(){return AIH.map(m=>'<div class="bub '+m.r+'">'+esc(m.t)+'</div>').join("")}
function aiDraw(){const l=$("#ailog");if(l){l.innerHTML=aiLog();tr(l);l.scrollTop=l.scrollHeight}}
function aiSheet(){
 sheet('<h3 class="hl"><img class="logo" src="'+LOGO_S+'" width="28" height="28" alt="">FindZo Helper</h3><div class="mu">Ask about products, prices, shops, or how to use the app.</div><div class="log" id="ailog">'+(AIH.length?aiLog():'<div class="bub a">Hi! I can help you find products, compare prices, or set up your shop. What do you need?</div>')+'</div>'+(AIH.length?'':'<div class="sug">'+AISUG.map(q=>'<button class="chip" data-a="aisug" data-q="'+esc(q)+'">'+esc(q)+'</button>').join("")+'</div>')+'<div class="air"><input id="aiq" placeholder="Type your question" aria-label="Ask the helper"><button class="btn" data-a="aisend">Send</button></div>');
 aiDraw();
}
async function askAI(t){
 t=(t||"").trim();
 if(!t||aiBusy||!AI)return;
 aiBusy=true;
 const hist=AIH.slice(-6).map(x=>(x.r==="u"?"Person: ":"Helper: ")+x.t).join("\n");
 AIH.push({r:"u",t},{r:"a",t:"Thinking..."});
 const slot=AIH[AIH.length-1],sg=$(".sug"),qi=$("#aiq");
 if(sg)sg.remove();if(qi)qi.value="";aiDraw();
 const owns=!!myB();
 const prompt="You are FindZo Helper, the assistant inside FindZo, a campus marketplace where students and small businesses sell products and services on LUANAR campus.\n"+
  (LANG==="ny"?"Reply in simple Chichewa as spoken in Malawi.\n":"")+"Rules: answer only about this marketplace, shopping, selling, pricing and using the app. Use ONLY the marketplace data below for facts about shops, products, prices and availability, and say so if you do not see something. Never invent shops, products or prices. Prices are in MWK. Reply in plain text with no markdown, friendly, under 120 words.\n"+
  "How the app works: browse Home or Search, tap a product to see its photo and details, tap Add to cart, open the cart, then Continue to payment. Orders are delivery only, to a campus location the buyer picks. Payment is cash on delivery or Airtel Money (buyer sends money to the seller and enters the reference, then the seller confirms). Sellers go to Profile, then Set up business, add products with photos and prices, mark items sold or available, and manage orders under Orders then Received.\n"+
  (owns?"This person owns a shop on the app, so you may also help them write product descriptions, choose prices and plan promotions.\n":"This person does not own a shop yet. If they want to sell, point them to Profile then Set up business.\n")+
  "Marketplace data (JSON): "+aiData()+"\n\nConversation so far:\n"+(hist||"(none)")+"\n\nLatest message from the person: "+t+"\n\nReply as FindZo Helper.";
 try{
  const r=await AI(prompt,{cache:false,modelTier:"quick",onText:x=>{slot.t=x.text;aiDraw()}});
  slot.t=(r.text||"").trim()||"Sorry, I could not come up with an answer.";
 }catch(e){
  slot.t=e&&e.code==="rate_limited"?"Too many questions at once. Please wait a moment and try again.":e&&e.code==="not_granted"?"The helper was not allowed to run, so I cannot answer right now.":"Sorry, something went wrong. Please try again.";
 }
 aiBusy=false;aiDraw();
}
function render(){$("#app").innerHTML=me()?shell():auth();tr($("#app"))}
function act(a,d){
 const m=me();
 switch(a){
  case"close":closeSheet();return;
  case"login":doLogin();return;
  case"logout":ls.del("findzo_me");S=newS();break;
  case"theme":ls.set("findzo_theme",isDark()?"light":"dark");applyTheme();break;
  case"nav":S.tab=d.t;S.biz=null;S.prod=null;S.manage=false;S.admin=false;break;
  case"back":if(S.admin)S.admin=false;else if(S.prod)S.prod=null;else{S.biz=null;S.manage=false}break;
  case"chip":S.cat=d.c;break;
  case"biz":S.prod=null;S.admin=false;S.biz=d.id;break;
  case"prod":S.prod=d.id;break;
  case"fav":{const f=db.favs[m.id]||(db.favs[m.id]=[]),i=f.indexOf(d.id);i>-1?f.splice(i,1):f.push(d.id);save();break}
  case"add":{const p=db.products.find(x=>x.id===d.id);
   if(cartCount()&&S.cartBiz!==p.bizId){if(!confirm("Your cart has items from another shop. Start a new cart?"))return;S.cart={}}
   S.cartBiz=p.bizId;S.cart[p.id]=(S.cart[p.id]||0)+1;toast("Added to cart");break}
  case"cart":if(!cartCount()){toast("Your cart is empty. Open a product and tap Add to cart.");return}cartSheet();return;
  case"cinc":S.cart[d.id]=(S.cart[d.id]||0)+1;cartSheet();break;
  case"cdec":S.cart[d.id]=(S.cart[d.id]||0)-1;if(S.cart[d.id]<1)delete S.cart[d.id];if(!cartCount())S.cartBiz=null;cartSheet();break;
  case"lang":LANG=LANG==="ny"?"en":"ny";ls.set("findzo_lang",LANG);break;case"fb":fbSheet();return;case"pay":paySheet();return;
  case"ai":aiSheet();return;
  case"aisend":askAI($("#aiq").value);return;
  case"aisug":askAI(d.q);return;
  case"place":{
   const items=Object.entries(S.cart).map(([id,q])=>{const p=db.products.find(x=>x.id===id);return{pid:id,name:p.name,price:p.price,qty:q}});
   if(!items.length)return;
   const gone=items.find(i=>!db.products.find(x=>x.id===i.pid).avail);if(gone){toast(gone.name+" has been sold");return}
   const shop=bz(S.cartBiz);if(shop.suspended){toast("This shop is suspended");return}
   const pay=$("#pm").value,ref=$("#pr")?$("#pr").value.trim():"";
   if(pay!=="cod"&&ref.length<4){toast("Enter the transaction reference");return}
   const o={id:uid(),buyerId:m.id,bizId:S.cartBiz,items,loc:$("#cl").value,note:$("#cn").value.trim(),status:"Pending",fee:feeOf(shop),total:orderTotal(),pf:Math.round(items.reduce((a,i)=>a+i.price*i.qty,0)*FEE_RATE),pay,ref,paid:false,ts:Date.now()};
   db.orders.push(o);save();S.cart={};S.cartBiz=null;S.biz=null;S.prod=null;S.tab="orders";S.ot="mine";placedSheet(o);break}
  case"ot":S.ot=d.t;break;
  case"status":{const o=db.orders.find(x=>x.id===d.id);if(o){o.status=d.to;if(d.to==="Completed"&&(o.pay||"cod")==="cod")o.paid=true;save();toast("Order: "+lbl(d.to).toLowerCase())}break}
  case"paid":{const o=db.orders.find(x=>x.id===d.id);if(o){o.paid=true;save();toast("Payment confirmed")}break}
  case"receipt":receiptSheet(d.id);return;
  case"rate":rateSheet(d.id);return;
  case"star":S.stars=+d.n;$("#stars").innerHTML=starsHtml();return;
  case"rsave":{const o=db.orders.find(x=>x.id===d.id);
   db.reviews.push({id:uid(),bizId:o.bizId,orderId:o.id,buyerId:m.id,stars:S.stars,text:$("#rt").value.trim(),ts:Date.now()});
   save();closeSheet();toast("Thanks for your review");break}
  case"report":reportSheet(d.id);return;
  case"rsend":db.reports.push({id:uid(),bizId:d.id,byId:m.id,reason:$("#rr").value,text:$("#rd").value.trim(),ts:Date.now(),open:true});save();closeSheet();toast("Report sent to the admin");break;
  case"dispute":disputeSheet(d.id);return;
  case"dsend":{const o=db.orders.find(x=>x.id===d.id);o.dispute={reason:$("#dr").value,text:$("#dd").value.trim(),ts:Date.now(),open:true};save();closeSheet();toast("Sent to the admin");break}
  case"rules":rulesSheet();return;
  case"admin":S.admin=true;S.biz=null;S.prod=null;S.manage=false;break;
  case"ver":{const b=bz(d.id);if(b){b.verified=!b.verified;save()}break}
  case"susp":{const b=bz(d.id);if(b){b.suspended=!b.suspended;save()}break}
  case"resrep":{const r=db.reports.find(x=>x.id===d.id);if(r){r.open=false;save()}break}
  case"resdis":{const o=db.orders.find(x=>x.id===d.id);if(o&&o.dispute){o.dispute.open=false;save()}break}
  case"settle":db.orders.filter(o=>o.bizId===d.id&&o.status==="Completed").forEach(o=>{o.pfPaid=true});save();toast("Fee marked as settled");break;
  case"saveLocs":{const l=[...new Set($("#locs").value.split("\n").map(x=>x.trim()).filter(Boolean))];
   if(l.length<2){toast("Add at least two locations");return}
   db.locs=l;save();applyLocs();toast("Locations saved");break}
  case"manage":S.manage=true;S.biz=null;S.prod=null;S.admin=false;break;
  case"savebiz":{const v=k=>$("#"+k).value.trim();
   if(!v("bn")){toast("Enter a shop name");return}
   let b=myB();
   if(!b&&!$("#bag").checked){toast("Please agree to the marketplace rules");return}
   const data={name:v("bn"),cat:v("bc"),desc:v("bd"),loc:v("bl"),phone:v("bp"),hours:v("bh"),fee:Math.max(0,Number(v("bf"))||0),sid:v("bs")};
   if(!data.loc){toast("Type your meet point");return}
   if(b)Object.assign(b,data);else db.businesses.push(Object.assign({id:uid(),ownerId:m.id,agreed:true},data));
   save();toast("Shop saved");break}
  case"pedit":prodSheet(d.id);return;
  case"psave":{const n=$("#pn").value.trim(),p=Number($("#pp").value);
   if(!n||!(p>0)){toast("Enter a name and a price above zero");return}
   const x=db.products.find(y=>y.id===d.id),dd=$("#pd").value.trim();
   if(x){x.name=n;x.price=p;x.desc=dd;x.img=S.img}else db.products.push({id:uid(),bizId:myB().id,name:n,price:p,desc:dd,img:S.img,avail:true});
   save();closeSheet();toast("Product saved");break}
  case"pdel":db.products=db.products.filter(x=>x.id!==d.id);delete S.cart[d.id];if(!cartCount())S.cartBiz=null;save();closeSheet();toast("Product deleted");break;
  case"ptog":{const x=db.products.find(y=>y.id===d.id);if(x){x.avail=!x.avail;save()}break}
  case"reset":if(confirm("Reset all data to the demo data? This removes your changes.")){db=seed();db.reports=[];db.reviews=[];db.users.push({id:"admin",name:"Admin",phone:"0990000000",admin:true});applyLocs();save();ls.del("findzo_me");S=newS();toast("Data reset")}break;
 }
 render();window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
 if(e.target.id==="ov"){closeSheet();return}
 const t=e.target.closest("[data-a]");if(!t||t.id==="ov")return;
 e.stopPropagation();act(t.dataset.a,t.dataset)
});
document.addEventListener("input",e=>{
 const k={q:"q",fc:"fc",fl:"fl",fp:"fp"}[e.target.id];
 if(k&&$("#res")){S[k]=e.target.value;$("#res").innerHTML=results();tr($("#res"))}
});
document.addEventListener("change",e=>{
 if(e.target.id==="pf"&&e.target.files[0]){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.img=c.toDataURL("image/jpeg",.7);$("#pv").innerHTML=pvHtml()};im.src=r.result};
  r.readAsDataURL(e.target.files[0]);
 }
 if(e.target.id==="pm"){$("#pinfo").innerHTML=payInfo(e.target.value);tr($("#pinfo"))}
});
document.addEventListener("input",e=>{if(e.target.id==="fb")fbLinks()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="aiq"){e.preventDefault();askAI(e.target.value)}});
S=newS();applyTheme();load();render();
if(window.claude&&claude.use)claude.use("sample").then(x=>{AI=x||null;if(AI&&me())render()}).catch(()=>{});
</script>
